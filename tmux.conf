# =============================================================================
# anticrab.tmux — personal tmux config
# Repo: ~/projects/anticrab.tmux  →  symlinked to ~/.config/tmux/tmux.conf
# =============================================================================

# ── Shell ────────────────────────────────────────────────────────────────────
# Force bash as the in-pane shell (default would inherit /bin/sh on some
# minimal images). `-l` makes it a login shell so ~/.bash_profile is sourced.
set -g default-shell /usr/bin/bash
set -g default-command "bash -l"

# ── Prefix ───────────────────────────────────────────────────────────────────
# C-a is closer to the home row than C-b and matches GNU screen muscle memory.
# Press C-a twice to send a literal C-a to the foreground app (readline, vim).
unbind C-b
set  -g prefix C-a
bind  C-a send-prefix

# ── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── General ──────────────────────────────────────────────────────────────────
set  -g  base-index       1     # windows numbered from 1, not 0
setw -g  pane-base-index  1
set  -g  renumber-windows on    # close window 2 of [1,2,3] → renumber to [1,2]
set  -g  history-limit    50000
set  -sg escape-time      10    # default 500ms breaks <Esc> in nvim
set  -g  focus-events     on    # nvim's FocusGained/FocusLost autocmds work
set  -g  mouse            on
set  -g  set-clipboard    on    # programs inside may set the clipboard (OSC 52)
set  -g  allow-passthrough on   # …and pass other escapes through — Claude Code
set  -s  extended-keys    on    # …and see Ctrl/Shift key combos (both per its docs)

# Which characters break a word for a double-click / `select-word`. tmux's
# default list contains - . / : so a double-click on ~/projects/foo-bar.lua
# grabs a fragment; with only whitespace, quotes and brackets separating words,
# paths, URLs, file.cpp:42 and user@host come out whole — matching WezTerm.
set  -g  word-separators  " \"'`()[]{}<>|,;"

# True colour + italics in modern terminals.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-256color:RGB,alacritty:RGB,foot:RGB"

# Per-terminal capabilities (tmux 3.2+). `usstyle` = styled underscores, so
# nvim's coloured LSP undercurls render; `hyperlinks` passes OSC 8 clickable
# links through to the outer terminal (wezterm) instead of stripping them.
# wezterm* matches TERM=wezterm (set via config.term in anticrab.wezterm).
set  -as terminal-features ",wezterm*:RGB:hyperlinks:usstyle"
set  -as terminal-features ",xterm-256color:RGB:hyperlinks:usstyle"

# ── Splits & windows (open in current pane's path) ───────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# ── Pane navigation ──────────────────────────────────────────────────────────
# vim-tmux-navigator (loaded via TPM) handles C-h/j/k/l natively across nvim
# and tmux panes. These prefix-bound mappings are a fallback for when the
# plugin isn't installed yet.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize (repeatable: hold prefix, tap H/J/K/L) ───────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ────────────────────────────────────────────────────────
bind -r C-p previous-window
bind -r C-n next-window

# ── Copy mode (vi keys, cleaned clipboard, selection stays visible) ──────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi C-v    send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Search in scrollback (smart-case) ────────────────────────────────────────
# `prefix f` → enter copy-mode and prompt for a pattern, search BACKWARD (the
# natural direction — what you want to find has already scrolled past).
# `prefix F` → same but forward. Once a match lands, `n`/`N` step through
# hits, `Enter` confirms (selection goes to clipboard via the existing y /
# mouse rules), `q` exits copy-mode.
#
# Why `f` and not `/`: `prefix /` is already taken for vertical split as a
# RU-layout alias for `prefix |` (see the RU-aliases section below).
#
# Smart-case: lowercase pattern → case-insensitive (`error` matches `ERROR`,
# `Error`, `error`). Add any uppercase letter to force case-sensitive
# matching (`Error` only matches `Error`). Same convention as vim's smartcase.
#
# Implementation: command-prompt stores the pattern in an env var, then
# scripts/smartsearch.sh transforms it (char-class wrap when no uppercase)
# and dispatches `send-keys -X search-<direction>` back into copy-mode.
bind f copy-mode \; command-prompt -p "search ↑" "set-environment -g _TMUX_SEARCH_PATTERN \"%%\" \; run-shell '~/.config/tmux/scripts/smartsearch.sh backward'"
bind F copy-mode \; command-prompt -p "search ↓" "set-environment -g _TMUX_SEARCH_PATTERN \"%%\" \; run-shell '~/.config/tmux/scripts/smartsearch.sh forward'"

# RU-layout aliases: `f` on JCUKEN is `а`, `F` is `А`.
bind а copy-mode \; command-prompt -p "search ↑" "set-environment -g _TMUX_SEARCH_PATTERN \"%%\" \; run-shell '~/.config/tmux/scripts/smartsearch.sh backward'"
bind А copy-mode \; command-prompt -p "search ↓" "set-environment -g _TMUX_SEARCH_PATTERN \"%%\" \; run-shell '~/.config/tmux/scripts/smartsearch.sh forward'"

# ── Copying to the clipboard ─────────────────────────────────────────────────
# Everything that copies runs the selection through scripts/copy-selection: it
# strips the left margin and trailing padding that TUI programs paint around
# their output (so a paste doesn't arrive indented), then writes the result to
# the system clipboard — once, so the GPaste history gets a single entry.
#
# `pipe-no-clear` / `pipe-and-cancel` rather than the copy-pipe* pair: copy-pipe
# would put the *unfiltered* selection on the clipboard itself (OSC 52) before
# the filter ever ran. The plain pipe commands only feed the command.
#
# #{selection_start_x} is the column the drag began at; the filter needs it to
# tell a mid-line drag (first line arrives without its indent) from a block of
# code that genuinely starts flush left, whose indentation must survive.
#
# Mouse copies keep the selection on screen so you can see what you took: a
# click clears it (and leaves copy mode when the scrollback is at the bottom),
# Escape or `q` leaves copy mode. Keyboard `y` / Enter copy and leave, as before.
bind -T copy-mode-vi y     send-keys -X pipe-and-cancel "~/.config/tmux/scripts/copy-selection #{selection_start_x}"
bind -T copy-mode-vi Enter send-keys -X pipe-and-cancel "~/.config/tmux/scripts/copy-selection #{selection_start_x}"

bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X pipe-no-clear "~/.config/tmux/scripts/copy-selection #{selection_start_x}"
bind -T copy-mode-vi MouseDown1Pane    select-pane \; if -F "#{==:#{scroll_position},0}" { send-keys -X cancel } { send-keys -X clear-selection }
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X pipe-no-clear "~/.config/tmux/scripts/copy-selection #{selection_start_x}"
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; send-keys -X pipe-no-clear "~/.config/tmux/scripts/copy-selection #{selection_start_x}"

# Same two gestures when the pane isn't in copy mode yet. `send -M` forwards the
# click to programs that handle the mouse themselves (nvim, Claude Code) — both
# select and copy on their own, and Claude Code's copy is already clean.
bind -T root DoubleClick1Pane select-pane \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; send-keys -X pipe-no-clear "~/.config/tmux/scripts/copy-selection #{selection_start_x}" }
bind -T root TripleClick1Pane select-pane \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; send-keys -X pipe-no-clear "~/.config/tmux/scripts/copy-selection #{selection_start_x}" }

# ── Look: JetBrains "Dark" (CLion New UI) ────────────────────────────────────
# Same palette as WezTerm (anticrab.wezterm) and zvim (jb.nvim in anticrab.nvim)
# so the three layers look like one program:
#   #1e1f22 editor bg   #2b2d30 panels   #43454a raised   #393b40 separators
#   #bcbec4 text        #9da0a8 dim      #6f737a dimmer   #dfe1e5 bright
#   #3574f0 accent      #214283 selection   #114957 search match
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#2b2d30,fg=#9da0a8"
set -g status-left  "#[bg=#3574f0,fg=#ffffff,bold] #S #[default] "
set -g status-left-length  30
set -g status-right "#[fg=#6f737a]%a %d.%m #[fg=#bcbec4]%H:%M "
set -g status-right-length 40
setw -g window-status-format          " #I #W "
setw -g window-status-current-format  "#[bg=#43454a,fg=#dfe1e5,bold] #I #W "
setw -g window-status-separator       ""
setw -g window-status-activity-style  "fg=#f2c55c"
setw -g window-status-bell-style      "fg=#f75464"

set -g message-style         "bg=#43454a,fg=#dfe1e5"
set -g message-command-style "bg=#43454a,fg=#dfe1e5"
set -g pane-border-style        "fg=#393b40"
set -g pane-active-border-style "fg=#3574f0"
set -g display-panes-colour        "#6f737a"
set -g display-panes-active-colour "#3574f0"
set -g clock-mode-colour           "#3574f0"
set -g popup-style        "bg=#1e1f22,fg=#bcbec4"
set -g popup-border-style "fg=#43454a"

# Selection and search in copy mode. JetBrains' own selection blue is visible on
# a grey background where the old #313244 was not; matches Visual in zvim.
set -g mode-style                     "bg=#214283"
set -g copy-mode-match-style          "bg=#114957,fg=#bcbec4"
set -g copy-mode-current-match-style  "bg=#3574f0,fg=#ffffff,bold"
set -g copy-mode-mark-style           "bg=#43454a,fg=#dfe1e5"

# ── Russian-layout aliases (ЙЦУКЕН) ──────────────────────────────────────────
# tmux receives the *character* produced by the keyboard layout, not the
# physical key. Under RU layout, `prefix h` actually delivers `prefix р` to
# tmux, so we bind both. Letter positions match QWERTY → ЙЦУКЕН (h↔р, etc.),
# uppercase variants share the same physical key.
#
# Special case: `Shift+\` produces `|` on EN but `/` on RU — hence the extra
# `bind /` for vertical split.

bind / split-window -h -c "#{pane_current_path}"   # RU: Shift+\ = /
bind с new-window      -c "#{pane_current_path}"   # с = c
bind к source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind м copy-mode                                    # м = v

bind   р select-pane -L     # р = h
bind   о select-pane -D     # о = j
bind   л select-pane -U     # л = k
bind   д select-pane -R     # д = l

bind -r Р resize-pane -L 5  # Р = H
bind -r О resize-pane -D 5  # О = J
bind -r Л resize-pane -U 5  # Л = K
bind -r Д resize-pane -R 5  # Д = L

bind -T copy-mode-vi м send-keys -X begin-selection   # м = v

# `y` (yank) under RU is `н`.
bind -T copy-mode-vi н send-keys -X pipe-and-cancel "~/.config/tmux/scripts/copy-selection #{selection_start_x}"

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
# install.sh clones TPM into plugins/tpm. After first launch, press `prefix I`
# to install the plugin set below.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save sessions every 15 min, auto-restore on tmux server start.
set -g @continuum-restore  'on'
set -g @continuum-save-interval '15'

# No status-bar plugin: the look above is a handful of lines and one dependency
# fewer. (catppuccin/tmux used to live here; `prefix M-u` or install.sh removes
# the leftover clone.)

# Keep this at the very bottom of the file.
run '~/.config/tmux/plugins/tpm/tpm'
