# =============================================================================
# anticrab.tmux — personal tmux config
# Repo: ~/projects/anticrab.tmux  →  symlinked to ~/.config/tmux/tmux.conf
# =============================================================================

# ── Shell ────────────────────────────────────────────────────────────────────
# Force bash as the in-pane shell (default would inherit /bin/sh on some
# minimal images). `-l` makes it a login shell so ~/.bash_profile is sourced.
set -g default-shell /usr/bin/bash
set -g default-command "bash -l"

# ── Prefix ───────────────────────────────────────────────────────────────────
# C-a is closer to the home row than C-b and matches GNU screen muscle memory.
# Press C-a twice to send a literal C-a to the foreground app (readline, vim).
unbind C-b
set  -g prefix C-a
bind  C-a send-prefix

# ── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── General ──────────────────────────────────────────────────────────────────
set  -g  base-index       1     # windows numbered from 1, not 0
setw -g  pane-base-index  1
set  -g  renumber-windows on    # close window 2 of [1,2,3] → renumber to [1,2]
set  -g  history-limit    50000
set  -sg escape-time      10    # default 500ms breaks <Esc> in nvim
set  -g  focus-events     on    # nvim's FocusGained/FocusLost autocmds work
set  -g  mouse            on
set  -g  set-clipboard    on

# True colour + italics in modern terminals.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-256color:RGB,alacritty:RGB,foot:RGB"

# ── Splits & windows (open in current pane's path) ───────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# ── Pane navigation ──────────────────────────────────────────────────────────
# vim-tmux-navigator (loaded via TPM) handles C-h/j/k/l natively across nvim
# and tmux panes. These prefix-bound mappings are a fallback for when the
# plugin isn't installed yet.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize (repeatable: hold prefix, tap H/J/K/L) ───────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ────────────────────────────────────────────────────────
bind -r C-p previous-window
bind -r C-n next-window

# ── Copy mode (vi keys + system clipboard) ───────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Clipboard tool detection: prefer wl-copy on Wayland, fall back to xclip.
# `if-shell` is evaluated once at config load.
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null' {
    bind -T copy-mode-vi y                    send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi MouseDragEnd1Pane    send-keys -X copy-pipe-and-cancel "wl-copy"
} {
    bind -T copy-mode-vi y                    send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
    bind -T copy-mode-vi MouseDragEnd1Pane    send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
}

# ── Status bar (minimal fallback; catppuccin replaces it once TPM installs) ──
set -g status-position top
set -g status-interval 5
set -g status-style    "bg=default,fg=white"
set -g status-left     "#[bold] #S #[default]| "
set -g status-left-length  30
set -g status-right    "#[fg=cyan]%Y-%m-%d %H:%M "
set -g window-status-current-style "bold,fg=green"

# ── Russian-layout aliases (ЙЦУКЕН) ──────────────────────────────────────────
# tmux receives the *character* produced by the keyboard layout, not the
# physical key. Under RU layout, `prefix h` actually delivers `prefix р` to
# tmux, so we bind both. Letter positions match QWERTY → ЙЦУКЕН (h↔р, etc.),
# uppercase variants share the same physical key.
#
# Special case: `Shift+\` produces `|` on EN but `/` on RU — hence the extra
# `bind /` for vertical split.

bind / split-window -h -c "#{pane_current_path}"   # RU: Shift+\ = /
bind с new-window      -c "#{pane_current_path}"   # с = c
bind к source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind м copy-mode                                    # м = v

bind   р select-pane -L     # р = h
bind   о select-pane -D     # о = j
bind   л select-pane -U     # л = k
bind   д select-pane -R     # д = l

bind -r Р resize-pane -L 5  # Р = H
bind -r О resize-pane -D 5  # О = J
bind -r Л resize-pane -U 5  # Л = K
bind -r Д resize-pane -R 5  # Д = L

bind -T copy-mode-vi м send-keys -X begin-selection   # м = v

# `y` (yank) under RU is `н`. Mirror the wl-copy / xclip branches.
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null' {
    bind -T copy-mode-vi н send-keys -X copy-pipe-and-cancel "wl-copy"
} {
    bind -T copy-mode-vi н send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
}

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
# install.sh clones TPM into plugins/tpm. After first launch, press `prefix I`
# to install the plugin set below.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# Auto-save sessions every 15 min, auto-restore on tmux server start.
set -g @continuum-restore  'on'
set -g @continuum-save-interval '15'

# Catppuccin variant (mocha matches anticrab.nvim's default).
set -g @catppuccin_flavour 'mocha'

# Keep this at the very bottom of the file.
run '~/.config/tmux/plugins/tpm/tpm'
